_config_version: 53

# Primary Orchestrator: NVIDIA Nemotron 3 Ultra on Ollama Cloud ($0.10/M input)
model:
  default: "nemotron-3-ultra"
  provider: "custom"
  base_url: "https://ollama.com/v1"
  api_key_env: "OLLAMA_API_KEY"

# Parallel Sub-Agents & Background Delegation: MiniMax M3.1 Flash ($0.15/M input, $0.015 cached)
delegation:
  model: "minimax-m3.1-flash"
  provider: "custom"
  base_url: "https://ollama.com/v1"
  api_key_env: "OLLAMA_API_KEY"

# Google Vertex AI / Enterprise AI (Authenticates via Cloud Run Service Account ADC)
vertex:
  project_id: "${GCP_PROJECT_ID}"
  region: "global"

# Automatic Multimodal / Vision / Video Fallback -> Google Vertex AI (Uses GCP Credits)
fallback_providers:
  - provider: "vertex"
    model: "google/gemini-3-flash-preview"
    on_capabilities: ["vision", "video", "audio"]

auxiliary:
  vision:
    provider: "vertex"
    model: "google/gemini-3-flash-preview"

# Speech-to-Text (STT): Free local Faster-Whisper on CPU (int8) with 5-min idle RAM unload
stt:
  enabled: true
  provider: "local"
  local:
    model: "base"
    device: "cpu"
    compute_type: "int8"
    vad: true
    unload_after_idle_seconds: 300

# Text-to-Speech (TTS): Google Gemini 3.8 Flash-Lite TTS (configure GEMINI_API_KEY in Hermes Settings -> Providers -> API Keys)
tts:
  provider: "gemini"
  gemini:
    model: "gemini-3.8-flash-lite-tts"
    voice: "Kore"
    audio_tags: false

# Voice Chat & Webapp Relay Settings
voice:
  voice_chat_mode: "chained"
  auto_tts: false
  auto_tts_mode: "voice_only"
  client_direct: false
  barge_in: true

# Single Multiplexed Gateway Serving All Bot Profiles
gateway:
  multiplex_profiles: true

# Web Dashboard (Port 9119)
dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 9119

# Browser-Hosted Hermes Desktop Workspace ("Webapp" — Port 9120)
webapp:
  enabled: true
  host: "0.0.0.0"
  port: 9120

# OpenAI-Compatible API Server for Your Apps & Omi/A2A Tools (Port 8000)
api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8000

platforms:
  api_server:
    enabled: true
    extra:
      host: "0.0.0.0"
      port: 8000
      model_routes:
        hermes-agent:
          model: "nemotron-3-ultra"
          provider: "custom"
          base_url: "https://ollama.com/v1"
        mixtape-agent:
          model: "minimax-m3.1-flash"
          provider: "custom"
          base_url: "https://ollama.com/v1"
        creative-tv:
          model: "google/gemini-3-flash-preview"
          provider: "vertex"
        dev-builder:
          model: "glm-5.3-flash"
          provider: "custom"
          base_url: "https://ollama.com/v1"
        qa-researcher:
          model: "minimax-m3.1-flash"
          provider: "custom"
          base_url: "https://ollama.com/v1"

# Required for SQLite stability on Google Cloud Storage FUSE mounts
database:
  journal_mode: "delete"
  auto_prune: false

sessions:
  auto_prune: false
